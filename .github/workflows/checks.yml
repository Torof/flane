# Flâne automatic checks (T0.2, T0.4b). Four jobs:
#   app-check     : types, lint, format, SPDX notices, tests, licences, the app assembles (app/)
#   secrets-check : gitleaks on the whole history, without any repository configuration
#   deps-check    : npm audit of the production code, compared with accepted advisories;
#                   red blocks a pull request only if it touches the package files
#                   (docs/CONVENTIONS.md)
#   version-check : tests of the repository tools; on a pull request, the app
#                   version must go up when the app changes (D-029)
# All four are required on main (ruleset protect-main, tools/dev/github-settings.sh).
# Actions are pinned by commit SHA. ${{ }} expressions are never written inside
# a `run`: they go through `env:`.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # every Monday: deps-check on main between two pull requests

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  app-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - id: install
        name: npm ci (lockfile, no install scripts)
        run: npm ci
      - id: typecheck
        name: Types
        run: npm run typecheck
      - id: lint
        name: Lint
        run: npm run lint
      - id: format
        name: Format
        run: npm run format:check
      - id: spdx
        name: SPDX notices
        run: npm run spdx
      - id: test
        name: Tests
        run: npm test
      - id: licenses
        name: Licences of production dependencies
        run: npm run licenses
      - id: bundle
        name: Assemble the app (test variant, offline, nothing uploaded)
        env:
          APP_VARIANT: preview
          EXPO_OFFLINE: '1'
        # EXPO_NO_TELEMETRY is set for the whole workflow; --no-install: never downloads.
        # Proves Metro assembles what instant updates publish; not that the app
        # starts, nor what is in the APK (the trial and the native version).
        run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            install=${{ steps.install.outcome }}
            typecheck=${{ steps.typecheck.outcome }}
            lint=${{ steps.lint.outcome }}
            format=${{ steps.format.outcome }}
            spdx=${{ steps.spdx.outcome }}
            test=${{ steps.test.outcome }}
            licenses=${{ steps.licenses.outcome }}
            bundle=${{ steps.bundle.outcome }}
        run: |
          failed=""
          for pair in $OUTCOMES; do
            case "$pair" in *=failure) failed="${pair%=*}" ;; esac
          done
          if [ -z "$failed" ]; then
            echo "## app-check: green" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## app-check: RED, step « $failed »"
            echo
            echo "Read: \`gh run view $GITHUB_RUN_ID --log-failed | grep -vE '^\s*$' | head -n 30\`"
            echo "Replay locally: \`cd app && npm run check && npm run licenses\`."
          } >> "$GITHUB_STEP_SUMMARY"

  secrets-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a repository gitleaks configuration or an exception annotation
        run: |
          set -euo pipefail
          if [ -e .gitleaks.toml ] || [ -e .gitleaksignore ]; then
            echo "## secrets-check: RED, gitleaks configuration provided by the repository (.gitleaks.toml or .gitleaksignore)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Lines added by the pull request, as in the pre-commit hook. The diff goes
          # to a file before the grep: a grep -q on a pipe under pipefail would make
          # the upstream command fail (SIGPIPE) and hide the match.
          # The pattern is split in two so that this file does not detect itself.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            added="$(mktemp)"
            git diff -U0 "$BASE_SHA...HEAD" | grep '^+' | grep -v '^+++' > "$added" || true
            if grep -q 'gitleaks:''allow' "$added"; then
              echo "## secrets-check: RED, gitleaks exception annotation added (an exception is recorded in the journal)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
      - name: Download gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          # shellcheck source=tools/dev/gitleaks.env
          . tools/dev/gitleaks.env
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/gitleaks.tar.gz "$url"
          printf '%s  %s\n' "$GITLEAKS_SHA256" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan the whole history (redacted, no report kept)
        run: |
          set -uo pipefail
          report="$(mktemp)"
          log="$(mktemp)"
          env -u GITLEAKS_CONFIG /tmp/gitleaks git --redact --no-banner --log-level error \
            --exit-code 1 --report-format json --report-path "$report" >"$log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "## secrets-check: green" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$report" "$log"
            exit 0
          fi
          {
            echo "## secrets-check: RED, secret detected or gitleaks error (code $rc)"
            echo
            # Rule, file, line and commit: never the value.
            python3 -I - "$report" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  results = json.load(f) or []
          except Exception:
              results = []
          for r in results[:30]:
              print(f"- rule {r.get('RuleID', '?')}, file {r.get('File', '?')}, line {r.get('StartLine', '?')}, commit {str(r.get('Commit', '?'))[:8]}")
          if not results:
              print("No usable result: gitleaks failed. Last lines of its output (redacted):")
          PY
            if [ ! -s "$report" ] || [ "$(tr -d '[:space:]' < "$report")" = "[]" ]; then
              echo '```'
              tail -n 5 "$log"
              echo '```'
            fi
            echo
            echo "Remove the secret and revoke it if it is real. No gitleaks exception: an exception is recorded in the journal."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$report" "$log"
          exit 1

  deps-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Tests of the audit script
        run: node --test tools/dev/audit.test.mjs
      - id: scope
        name: Decide whether a red audit blocks this run
        run: |
          set -euo pipefail
          # On main and on Mondays: always. On a pull request: only if it
          # touches the package files (docs/CONVENTIONS.md).
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            blocking=true
          elif [ -n "$(git diff --name-only "$BASE_SHA...HEAD" -- app/package.json app/package-lock.json)" ]; then
            blocking=true
          else
            blocking=false
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking"
      - name: npm audit of production dependencies (reads the lockfile, no install)
        working-directory: app
        # npm audit exits with 1 as soon as there is an advisory: audit.mjs is the judge,
        # and it exits with 2 if the JSON is a registry error or empty.
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
      - name: Compare with accepted advisories
        env:
          BLOCKING: ${{ steps.scope.outputs.blocking }}
        run: |
          set -uo pipefail
          node tools/dev/audit.mjs --audit "$RUNNER_TEMP/audit.json" --lock app/package-lock.json \
            --accepted tools/dev/audit-accepted.json --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$BLOCKING" != "true" ]; then
            {
              echo
              echo "_For information: this pull request touches neither \`app/package.json\` nor \`app/package-lock.json\`; this red does not block it (\`docs/CONVENTIONS.md\`). To fix in a dependencies slice._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  version-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
      - name: Tests of the repository tools
        run: node --test tools/dev/*.test.mjs
      - name: The version goes up when the app changes
        # Only on a pull request: on main and on Mondays there is no base to compare.
        # With strict: false, a main that moved after this run is not checked again.
        if: github.event_name == 'pull_request'
        # HEAD is the merge commit GitHub builds on the current main: its first
        # parent is that main, so a main that moved since the event is compared too.
        run: node tools/dev/check-version-bump.mjs --base "$(git rev-parse HEAD^1)" --summary "$GITHUB_STEP_SUMMARY"
