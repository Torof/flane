name: Bug on the road
description: Something went wrong during a trip or while preparing a trip.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Two rules to protect your privacy: **paste neither GPS coordinates nor a screenshot showing your position**, and describe the place by an approximate stretch of road (« between Briançon and Embrun »), never by an address.
  - type: textarea
    id: quoi
    attributes:
      label: What happened
      description: What Flâne did, and what you expected.
    validations:
      required: true
  - type: input
    id: troncon
    attributes:
      label: Approximate stretch of road
      placeholder: "between Briançon and Embrun"
    validations:
      required: false
  - type: dropdown
    id: moment
    attributes:
      label: Moment
      options:
        - While preparing the trip (stopped)
        - On the road (moving)
        - Stopped during the trip
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flâne version and phone model
      placeholder: "0.1.0, Pixel 7"
    validations:
      required: false
  - type: checkboxes
    id: vieprivee
    attributes:
      label: Privacy
      options:
        - label: I pasted no coordinates, no address, and no screenshot showing my position.
          required: true
