name: Idea
description: A suggestion for Flâne. It will go to the backlog's parking, reviewed at the end of each milestone.
title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are read at the start of each session and noted in the parking (`docs/BACKLOG.md`). They are reviewed at the end of each milestone. No need to detail the solution: the need is enough.
  - type: textarea
    id: besoin
    attributes:
      label: The need
      description: In what situation, on the road or before, would this idea help you?
    validations:
      required: true
  - type: textarea
    id: piste
    attributes:
      label: A possible approach (optional)
    validations:
      required: false
