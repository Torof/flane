# Dependabot (T0.2): a monthly appointment, one grouped pull request per
# ecosystem. A Dependabot pull request is never merged as is: it is redone in
# a dependency slice (D-025, docs/CONVENTIONS.md).
# The Expo and React family is excluded: those packages follow the SDK through
# `npx expo install --check`; for a 0.x like react-native, Dependabot would
# call a breaking change « minor ».
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'typescript'
      - dependency-name: '@types/react'
